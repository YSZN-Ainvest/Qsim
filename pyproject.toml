[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qinml-qsim"
version = "0.3.0"
description = "Streaming matrix factor research simulator with VWAP execution"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2", "pyarrow>=15", "matplotlib>=3.8", "threadpoolctl>=3"]

[project.scripts]
qsim = "qsim.cli:main"

[tool.setuptools.packages.find]
include = ["qsim*"]
