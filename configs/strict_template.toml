# Fill historical ST table before running. Never infer historical ST/industry from today's snapshot.
[backtest]
mode = "StatsEvery"
start = "2023-01-03"
end = "2023-12-29"
frequency = "0800"
allow_os = false
holding_period = 1
forecast_period = 5
groups = 10
capital = 10000000.0

[operations]
exclude_st = true
st_unknown = "error"
st_path = ""
# exposures_path = "/path/to/historical_exposures.parquet"
# neutralize_styles = ["size", "beta"]
# neutralize_industries = ["industry"]

# A custom factor uses kind=table, path and column. Mandatory keys:
# available_at, order_book_id, <factor column>.
[[factors]]
name = "momentum20"
kind = "momentum"
lookback = 20
weight = 1.0

[output]
name = "strict_research"

[stats]
nIntvDelay = 1
isTradeT1 = true
