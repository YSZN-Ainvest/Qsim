[data]
warmup_days = 10

[backtest]
start = "2024-01-02"
end = "2024-01-19"
frequency = "0800"
mode = "StatsEvery"
groups = 3

[universe]
kind = "symbols"
symbols = ["000001.XSHE", "000002.XSHE", "000004.XSHE", "000005.XSHE", "000006.XSHE", "000007.XSHE"]

[operations]
st_unknown = "allow"
min_cross_section = 3

[compute]
pools = 2
batch_pools = 2
memory_per_job_mb = 768

[alphas.alpha1]
kind = "momentum"
lookback = 5

[alphas.alpha2]
kind = "reversal"
lookback = 3

[alphas.alpha3]
kind = "volatility"
lookback = 5

[combine]
expression = "0.5*<alpha1> + 0.25*(<alpha2> + <alpha3>)"
stage = "processed"

[output]
directory = "/mnt/nas/qinml_cache/qsim/result"
name = "streaming_demo"
stream = true
factors = true
positions = true
plots = true
materialize = false

[livetest]
samples = 3
seed = 17
